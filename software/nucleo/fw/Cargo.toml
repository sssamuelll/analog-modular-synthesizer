[package]
name = "sam17-nucleo-fw"
version = "0.1.0"
edition = "2021"
description = "El firmware del cerebro del SAM17 sobre STM32N657"

# Workspace propio: compila para thumbv8m y `core` para el host. En estable no
# hay `forced-target`, asi que compartirlo haria que `cargo test` en la raiz
# intentara compilar esto para tu maquina.
[workspace]

[dependencies]
sam17-nucleo-core = { path = "../core" }

# Todos los crates de embassy salen de la MISMA fuente a proposito: mezclar
# crates.io y git duplica `embassy-usb-driver` y los tipos dejan de casar.
#
# La fuente es la rama `n6-usb` de nuestro fork: embassy `main` del 08-09 mas
# los tres commits de embassy-rs/embassy#6939 (el USB OTG HS del N6, mergeado
# arriba el 09-09) y, desde el 2026-10-01, el arreglo del bring-up del PHY que
# colgaba el bus en placa (embassy-rs/embassy#7146, abierto). El `rev` exacto
# queda fijado en `Cargo.lock`.
#
# ponytail: vuelve a `version` de crates.io el dia que #7146 salga en una release.
# "exti" no va: nada en fw/src usa ExtiInput (grep -rn "exti" src/ da cero) y
# con la feature puesta embassy define su propio manejador de EXTI11, que
# chocaria con el del esclavo del banco (tarea 9).
embassy-stm32 = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = [
    "stm32n657x0",
    "time-driver-any",
    "unstable-pac",
    "defmt",
] }
# "executor-interrupt": D5 del papel del maestro pone las tareas de ranura del
# J2 en el ejecutor de interrupcion, no en el de hilo (R-MJ5).
embassy-executor = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = ["defmt"] }
embassy-usb = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", default-features = false, features = ["defmt"] }
embassy-futures = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb" }
# embassy-sync trae AtomicWaker para la ISR del J2 (tarea 8).
embassy-sync = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb" }

defmt = "1.1"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
# `critical-section-single-core` la daba `embassy-rp` con su feature
# `critical-section-impl`; en STM32 la pone el usuario.
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
static_cell = "2"

[profile.release]
debug = 2
lto = true
opt-level = "s"

[features]
# El bucle del primer reporte de embassy#5607 en `control_positivo` (EN-PLACA, punto (1)).
bucle-del-reporte = []
# El eco con puente MOSI-MISO a 16 MHz en `control_positivo` (EN-PLACA, punto (1)).
eco = []
# El desglose de un giro del J2 por tramos, en ciclos (`perfil.rs`). Solo para el banco.
perfil = []
# El perfilador por muestreo del PC (`muestreo.rs`, `perfil_pc.py`). Solo para el banco.
muestreo = []
# El nucleo a 800 MHz, el reloj de diseno del hub (`usb::configuracion_hub`), en los
# binarios de medida de carga. Sin la feature corren a 64 MHz, como siempre.
reloj-hub = []
# Mas ranuras girando en `carga_j2` y `perfil_pc`: 2 suma SPI1 (ranura 2), 3 suma tambien
# SPI2 (ranura 3). Sin modulo detras: solo miden el transporte. Pines en `j2_banco`.
ranuras-2 = []
# El transporte por ISR de `j2_isr` en `carga_j2`, en lugar del ejecutor: la cota de
# lo que cuesta el mismo giro sin futuros. Solo la ranura 0.
transporte-isr = []
# El transporte por tic de `j2_tic` (papel v2, prototipo de banco de la ficha 3 del acta
# del 17-10) en `carga_j2` y `resistencia_j2`, en lugar del ejecutor. Una ranura de banco
# por SPI, mas las de relleno que pidan `ranuras-2` y `ranuras-3`.
transporte-tic = []
# Fallos a pedido para los binarios de recuperacion del transporte por tic: envenenar una
# ranura y forzar la escalada del GPDMA1. Solo para el banco.
inyeccion = ["transporte-tic"]
# La bajada que no compone nada (`j2_banco::bajada_quieta`) en `carga_j2`: el enlace solo, sin
# el costo de componer la trama (ficha 1 del acta del 17-10).
sin-componer = []
# Las cotas de v2 (2 y 4 tics) para `Vencida` y `Reiniciando`, en vez de las de hoy (100 y 100): lo que
# cambia la revision de Halberg del 17-10, hallazgo 1, medido en placa con `tic_recupera`.
cotas-v2 = ["transporte-tic"]
# `tic_banco` con una interrupcion de P2 que acapara la CPU un rato cada 10 ms, por encima
# del planificador (P3) y por debajo del tic (P1): cuanto puede retener el hub antes de que
# se pierdan tramas.
acapara = ["inyeccion"]
# El esclavo del banco comprueba el contenido de la bajada que recibe (`PATRON_BAJADA`) y
# cuenta las buenas y las malas. Para `tic_banco` y `tic_recupera`.
verifica-bajada = []
# Marcos numerados en los dos sentidos (`core::marcos_j2`): el cerebro numera cada bajada, el esclavo
# la clasifica (rota, repetida, atrasada, saltada) y devuelve su numero en la subida, y el juez del
# cerebro hace lo mismo con la subida. Para `tic_estres`.
secuencia = ["verifica-bajada"]
# Una tabla de 16 contenidos de prueba (`j2_banco::tabla`) por la bajada, y el esclavo cuenta cuales llegan
# enteros: para ver que contenidos maltrata el enlace del banco. Para `tic_contenidos`.
tabla = ["verifica-bajada"]
# La velocidad de borde de los pines del J2 (maestro y MISO del esclavo) en `Medium` o en `Low` en vez de
# `VeryHigh`: con `VeryHigh` el cableado de puentes del banco rompe los marcos de apariencia aleatoria.
pines-medio = []
pines-bajo = []
# El mensaje del banco de 41, 71 o 103 bytes (`TONO`, `BAHIA`, `SET` de dieciseis) en vez de
# los 25 de `NADA`: lo que cuesta el transporte segun el largo.
largo-41 = []
largo-71 = []
largo-103 = []
# Una tarea de hilo que recorre 64 KB entre vuelta y vuelta en `carga_j2`: cada tic y cada
# pasada del planificador empiezan con la D-cache desalojada.
contaminador = []
# El contaminador recorre 8, 16 o 32 KB en vez de 64: desaloja una parte de la D-cache (32 KB).
contaminador-8k = ["contaminador"]
contaminador-16k = ["contaminador"]
contaminador-32k = ["contaminador"]
# El periodo del banco a 1 kHz en `tic_banco`, en vez de los 8 kHz del instrumento.
mil-hz = []
# Una corrida de 20 s en `tic_banco`, en vez de 600.
corta = []
# `tic_recupera` y `tic_banco` sin el esclavo del banco: la fase de la escalada resetea el GPDMA1
# entero y el esclavo comparte el controlador; y con `acapara` el esclavo es una tarea de P2 a la
# que los golpes tambien pegan.
sin-esclavo = []
# La fase C de `tic_recupera`: la escalada del GPDMA1 con las vecinas en vuelo.
escalada = []
ranuras-3 = ["ranuras-2"]
# La I-cache y la D-cache encendidas en `perfil_pc`, sin la region MPU de los buferes del
# DMA (R-MJ7): es de exploracion, como la pasada `-sin-mpu` de `carga_j2`.
caches = []

# `perfil_pc` necesita el modulo que solo existe con la feature: sin ella no se compila.
[[bin]]
name = "perfil_pc"
path = "src/bin/perfil_pc.rs"
required-features = ["muestreo"]

# `tic_banco` necesita el modulo que solo existe con la feature: sin ella no se compila.
[[bin]]
name = "tic_banco"
path = "src/bin/tic_banco.rs"
required-features = ["transporte-tic"]

[[bin]]
name = "tic_recupera"
path = "src/bin/tic_recupera.rs"
required-features = ["inyeccion"]

[[bin]]
name = "tic_cota"
path = "src/bin/tic_cota.rs"
required-features = ["inyeccion"]

[[bin]]
name = "tic_estres"
path = "src/bin/tic_estres.rs"
required-features = ["inyeccion", "secuencia"]

[[bin]]
name = "tic_contenidos"
path = "src/bin/tic_contenidos.rs"
required-features = ["transporte-tic", "tabla"]
