[package]
name = "sam17-nucleo-fw"
version = "0.1.0"
edition = "2021"
description = "El firmware del cerebro del SAM17 sobre STM32N657"

# Workspace propio: compila para thumbv8m y `core` para el host. En estable no
# hay `forced-target`, asi que compartirlo haria que `cargo test` en la raiz
# intentara compilar esto para tu maquina.
[workspace]

[dependencies]
sam17-nucleo-core = { path = "../core" }

# Todos los crates de embassy salen de la MISMA fuente a proposito: mezclar
# crates.io y git duplica `embassy-usb-driver` y los tipos dejan de casar.
#
# La fuente es la rama `n6-usb` de nuestro fork, que es embassy `main` mas los
# tres commits de embassy-rs/embassy#6939 -- el soporte de USB OTG HS del N6,
# que `main` todavia no tiene y sin el cual `usb.rs` no compila. La rama va
# rebasada sobre `main` y el `rev` exacto queda fijado en `Cargo.lock`.
#
# ponytail: vuelve a `version = "0.6"` de crates.io el dia que #6939 mergee.
# "exti" no va: nada en fw/src usa ExtiInput (grep -rn "exti" src/ da cero) y
# con la feature puesta embassy define su propio manejador de EXTI11, que
# chocaria con el del esclavo del banco (tarea 9).
embassy-stm32 = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = [
    "stm32n657x0",
    "time-driver-any",
    "unstable-pac",
    "defmt",
] }
# "executor-interrupt": D5 del papel del maestro pone las tareas de ranura del
# J2 en el ejecutor de interrupcion, no en el de hilo (R-MJ5).
embassy-executor = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", features = ["defmt"] }
embassy-usb = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb", default-features = false, features = ["defmt"] }
embassy-futures = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb" }
# embassy-sync trae AtomicWaker para la ISR del J2 (tarea 8).
embassy-sync = { git = "https://github.com/sssamuelll/embassy", branch = "n6-usb" }

defmt = "1.1"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
# `critical-section-single-core` la daba `embassy-rp` con su feature
# `critical-section-impl`; en STM32 la pone el usuario.
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
static_cell = "2"

[profile.release]
debug = 2
lto = true
opt-level = "s"
