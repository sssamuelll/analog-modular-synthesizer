name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hardware:
    name: Puertas de calidad del hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sin dependencias a proposito: los gates son stdlib. Los dos scripts que
      # necesitan KiCad (pcbnew, ngspice.dll) salen declarados como HUECO en el
      # resumen -- instalar KiCad entero aqui costaria mas que lo que cubre.
      - name: Gates
        run: python hardware/tools/gates.py

  firmware:
    name: MIDI/CV firmware (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/midi-cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/midi-cv/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --cov=sam17 --cov-report=term-missing

  docs:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'

  # Este job no ha corrido nunca: Actions esta deshabilitado en el repositorio
  # (privado) y el workflow figura como `disabled_manually`. Se escribe igual
  # para que la receta este completa el dia que se encienda -- y porque
  # .githooks/pre-push la espeja paso a paso, que es lo que de verdad corre.
  nucleo:
    name: Nucleo digital (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Formato
        run: cargo fmt --all --check
